# 代码检查：每次 push / PR 跑一遍，挡掉坏题库、单测回归、类型错误、构建失败
# 不改任何环境，纯验证（公开仓库不消耗额度）
name: CI

on:
  push:
    branches: [main, python/0.0.1]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端（题库校验 + 单元测试 + 端到端冒烟）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: 安装依赖（含测试依赖）
        run: pip install -r requirements-dev.txt

      - name: 校验题库格式
        run: python scripts/validate_questions.py

      - name: 后端单元测试
        run: python -m pytest -q

      - name: 端到端冒烟测试（起真实服务跑完整流程）
        run: |
          uvicorn app.main:app --port 8000 --log-level warning &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/api/health > /dev/null   # 起不来就失败
          python scripts/smoke_test.py

  frontend:
    name: 前端（类型检查 + 生产构建）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 类型检查
        run: npx tsc -b

      - name: 生产构建
        run: npm run build
