# 单容器部署：FastAPI（API + 前端静态文件）+ SQLite 单文件数据库
# 用法：
#   docker compose up -d --build      # 启动（首次会构建镜像）
#   docker compose logs -f            # 看日志
#   docker compose down               # 停止（数据保留在 volume 里）
#
# 小内存服务器建议：不要再加 nginx（本服务已托管前端+gzip），需要 HTTPS 时用宿主机的
# Caddy/Nginx 反代到 8000 端口即可。

services:
  kotone:
    build: .
    image: kotonego:0.0.1
    # 容器名，可改（同一台机器跑多份时才需要改，比如 KOTONE_NAME=kotone-staging）
    container_name: "${KOTONE_NAME:-kotonego}"
    restart: unless-stopped

    ports:
      # 监听地址:宿主机端口:容器端口。容器内部固定 8000，只需改中间那个数字。
      # 改端口：项目根目录 .env 里写 KOTONE_PORT=9000，或 KOTONE_PORT=9000 docker compose up -d
      # 只想本机访问（前面挂了 Caddy/Nginx）就把 KOTONE_BIND 设成 127.0.0.1
      - "${KOTONE_BIND:-0.0.0.0}:${KOTONE_PORT:-8010}:8000"

    environment:
      KOTONE_DB_PATH: /data/kotone.db
      KOTONE_EXAM_SIZE: "10"
      # 单容器部署前后端同源，不需要 CORS；留空表示不额外放行来源
      KOTONE_CORS_ORIGINS: ""

    volumes:
      # 命名卷：数据库持久化，容器重建不丢数据（首次启动自动创建）
      - kotone-data:/data
      # 想在服务器上直接改题目（不用重新构建镜像）就放开下面一行：
      # - ./backend/data/questions:/app/backend/data/questions:ro

    # ---- 小内存保护（按需调整）----
    mem_limit: 320m          # 实测峰值 < 120MB，留足余量；1GB 小机器可改 256m
    memswap_limit: 320m      # 禁止用 swap 兜底，避免拖慢整机
    cpus: 1.0

    # 日志轮转，避免长期运行把磁盘写满
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  kotone-data:
